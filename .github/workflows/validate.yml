name: Validate

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: python -m py_compile shad_self_KIA.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
